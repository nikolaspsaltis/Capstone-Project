name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          ruff check .

      - name: Black format check
        run: |
          black --check --quiet .

      - name: Compile check
        run: |
          python -m compileall app scripts tests alembic

      - name: Prepare test schema
        env:
          JWT_SECRET: ci-secret-not-for-production
          JWT_ISSUER: capstone-tests
          JWT_AUDIENCE: capstone-tests-client
          DATABASE_URL: sqlite:///./ci_test.db
          API_KEYS: test-api-key
        run: |
          alembic upgrade head

      - name: Pytest with coverage
        env:
          JWT_SECRET: ci-secret-not-for-production
          JWT_ISSUER: capstone-tests
          JWT_AUDIENCE: capstone-tests-client
          DATABASE_URL: sqlite:///./ci_test.db
          API_KEYS: test-api-key
          TESTING: "1"
          BCRYPT_TEST_ROUNDS: "4"
        run: |
          pytest

      - name: API smoke test
        env:
          JWT_SECRET: ci-secret-not-for-production
          JWT_ISSUER: capstone-project
          JWT_AUDIENCE: capstone-client
          DATABASE_URL: sqlite:///./ci_smoke.db
          API_KEYS: ci-smoke-api-key
        run: |
          alembic upgrade head

          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          sleep 3

          curl -fsS http://127.0.0.1:8000/health

          curl -fsS -X POST http://127.0.0.1:8000/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"secret123"}'

          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"secret123"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          curl -fsS http://127.0.0.1:8000/profile -H "Authorization: Bearer $TOKEN"
          curl -fsS http://127.0.0.1:8000/data -H "X-API-Key: ci-smoke-api-key"

      - name: Security and load regression smoke
        env:
          JWT_SECRET: ci-secret-not-for-production
          JWT_ISSUER: capstone-project
          JWT_AUDIENCE: capstone-client
          DATABASE_URL: sqlite:///./ci_regression.db
          API_KEYS: ci-regression-api-key
        run: |
          set -euo pipefail
          alembic upgrade head

          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          sleep 3

          python scripts/bruteforce_login.py | tee /tmp/bruteforce.out
          grep -q "Valid credential found" /tmp/bruteforce.out

          python scripts/token_tampering.py | tee /tmp/token_tampering.out
          grep -q "PASS: Tampered token was rejected" /tmp/token_tampering.out

          python scripts/unauthorized_admin_access.py | tee /tmp/unauth_admin.out
          grep -q "PASS: Non-admin user denied admin endpoint" /tmp/unauth_admin.out

          rm -f results/performance_*.csv
          python scripts/performance_test.py | tee /tmp/perf.out
          grep -q "CSV written to:" /tmp/perf.out
          ls results/performance_*.csv >/dev/null

      - name: Zero-trust attack demo
        env:
          JWT_SECRET: ci-secret-not-for-production
          JWT_ISSUER: capstone-project
          JWT_AUDIENCE: capstone-client
          DATABASE_URL: sqlite:///./ci_zt.db
          API_KEYS: ci-zt-api-key
          WORKLOAD_ATTESTATION_SECRET: ci-attestation-secret
          APP_ENV: prod
        run: |
          alembic upgrade head

          uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          sleep 3

          python scripts/run_capstone_evaluation.py --base-url http://127.0.0.1:8001
